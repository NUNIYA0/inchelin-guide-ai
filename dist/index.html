<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="업무 데이터와 지식에 질문하는 AI 채팅 인터페이스" />
  <title>Insight AI Chat</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23000'/%3E%3Cpath d='M18 42 30 17h7l10 25h-8l-2-6H27l-2 6zm12-12h5l-2-7z' fill='white'/%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: light;
      --ink: #090909;
      --muted: #858585;
      --line: #e9e9e9;
      --panel: #f8f8f8;
      --soft: #f3f3f3;
      --shadow: 0 12px 34px rgba(0,0,0,.07), 0 1px 5px rgba(0,0,0,.04);
      --rail: 60px;
      --sidebar: 288px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: #fff;
      font-family: Pretendard, "Noto Sans KR", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, textarea { font: inherit; }
    button { color: inherit; }
    .app { min-height: 100dvh; display: flex; }
    .rail {
      position: relative;
      z-index: 30;
      width: var(--rail);
      flex: 0 0 var(--rail);
      background: #fafafa;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 0 14px;
    }
    .brand {
      width: 38px;
      height: 38px;
      border: 0;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
      margin-bottom: 15px;
    }
    .brand-mark { font-weight: 900; font-size: 22px; letter-spacing: -3px; transform: skew(-7deg); }
    .rail-nav { display: flex; flex-direction: column; gap: 9px; }
    .rail-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
    .icon-btn {
      width: 38px;
      height: 38px;
      padding: 0;
      border: 0;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: transparent;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease;
    }
    .icon-btn:hover { background: #eee; }
    .icon-btn:active { transform: scale(.96); }
    .icon-btn.active { background: #ededed; }
    .icon-btn svg { width: 19px; height: 19px; stroke: #6e6e6e; }
    .sidebar {
      position: fixed;
      z-index: 20;
      inset: 0 auto 0 var(--rail);
      width: var(--sidebar);
      padding: 18px 15px;
      background: #f8f8f8;
      border-right: 1px solid var(--line);
      transform: translateX(calc(-1 * var(--sidebar)));
      transition: transform .28s cubic-bezier(.2,.8,.2,1);
      display: flex;
      flex-direction: column;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .sidebar-title { font-size: 15px; font-weight: 700; }
    .new-chat {
      width: 100%;
      border: 1px solid #dedede;
      border-radius: 11px;
      background: #fff;
      padding: 11px 13px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
    }
    .new-chat:hover { background: #fdfdfd; border-color: #cfcfcf; }
    .history-label { margin: 24px 4px 10px; font-size: 12px; color: #888; }
    .history-item { border: 0; background: transparent; padding: 9px 8px; text-align: left; border-radius: 8px; color: #4f4f4f; cursor: pointer; }
    .history-item:hover { background: #ededed; }
    .sidebar-foot { margin-top: auto; font-size: 12px; color: #999; padding: 10px 6px; }
    .main {
      min-width: 0;
      min-height: 100dvh;
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: margin-left .28s cubic-bezier(.2,.8,.2,1);
    }
    .main.shift { margin-left: var(--sidebar); }
    .topbar {
      height: 74px;
      flex: 0 0 74px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 20px;
      gap: 8px;
    }
    .top-chat { width: 34px; height: 34px; border-radius: 11px; background: #000; }
    .top-chat svg { stroke: #fff; width: 17px; height: 17px; }
    .dots { font-weight: 800; color: #737373; letter-spacing: 2px; }
    .start-btn {
      height: 34px;
      border: 0;
      border-radius: 999px;
      background: #000;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 0 17px;
      cursor: pointer;
    }
    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 12px 24px 94px;
    }
    .welcome { width: min(720px, 100%); transform: translateY(-3px); }
    h1 {
      margin: 0 0 66px;
      text-align: center;
      font-size: clamp(27px, 3.1vw, 34px);
      line-height: 1.3;
      letter-spacing: -.045em;
      font-weight: 760;
    }
    .composer {
      border: 1px solid #e2e2e2;
      border-radius: 24px;
      min-height: 112px;
      background: #fff;
      padding: 14px 14px 10px 17px;
      box-shadow: var(--shadow);
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .composer:focus-within { border-color: #bcbcbc; box-shadow: 0 15px 42px rgba(0,0,0,.09); }
    textarea {
      width: 100%;
      height: 50px;
      max-height: 135px;
      resize: none;
      outline: none;
      border: 0;
      background: transparent;
      color: #171717;
      font-size: 15px;
      line-height: 1.55;
      padding: 0;
    }
    textarea::placeholder { color: #b0b0b0; }
    .composer-actions { display: flex; justify-content: space-between; align-items: center; }
    .plus { width: 34px; height: 34px; color: #5f5f5f; font-size: 22px; line-height: 1; }
    .send {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 0;
      background: #000;
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: opacity .18s ease, transform .18s ease;
    }
    .send:disabled { opacity: .38; cursor: default; }
    .send:not(:disabled):hover { transform: translateY(-1px); }
    .send svg { width: 19px; height: 19px; }
    .suggestions { margin-top: 23px; display: flex; flex-direction: column; gap: 0; }
    .suggestion {
      min-height: 48px;
      padding: 0 3px;
      border: 0;
      border-bottom: 1px solid transparent;
      background: transparent;
      color: #6d6d6d;
      font-size: 14px;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: color .18s ease, padding .18s ease;
    }
    .suggestion:hover { color: #111; padding-left: 9px; }
    .suggestion span:last-child { color: #aaa; font-size: 17px; }
    .chat-view { width: min(760px, 100%); height: 100%; display: none; flex-direction: column; }
    .chat-view.active { display: flex; }
    .messages { flex: 1; overflow: auto; padding: 20px 6px 24px; scrollbar-width: thin; }
    .message { max-width: 82%; margin: 0 0 20px; line-height: 1.65; font-size: 15px; }
    .message.user { margin-left: auto; border-radius: 18px 18px 4px 18px; background: #f1f1f1; padding: 11px 15px; }
    .message.ai { color: #303030; }
    .message.ai::before { content: "A"; width: 27px; height: 27px; display: grid; place-items: center; border-radius: 9px; background: #000; color: white; font-size: 12px; font-weight: 800; margin-bottom: 8px; }
    .chat-composer { flex: 0 0 auto; margin-bottom: 22px; min-height: 82px; border-radius: 21px; }
    .chat-composer textarea { height: 33px; }
    .popover {
      position: absolute;
      z-index: 50;
      top: 62px;
      right: 20px;
      width: 210px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 7px;
      box-shadow: 0 16px 44px rgba(0,0,0,.12);
      display: none;
    }
    .popover.open { display: block; animation: reveal .15s ease-out; }
    .popover button { width: 100%; border: 0; border-radius: 9px; padding: 10px; text-align: left; background: transparent; cursor: pointer; }
    .popover button:hover { background: #f3f3f3; }
    .toast {
      position: fixed;
      z-index: 60;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      background: #151515;
      color: #fff;
      border-radius: 999px;
      padding: 10px 15px;
      font-size: 13px;
      transition: .22s ease;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .scrim { display: none; }
    @keyframes reveal { from { opacity: 0; transform: translateY(-5px); } }
    @media (max-width: 820px) {
      :root { --rail: 52px; --sidebar: min(286px, calc(100vw - var(--rail))); }
      .main.shift { margin-left: 0; }
      .scrim { position: fixed; z-index: 15; inset: 0; background: rgba(0,0,0,.14); opacity: 0; display: block; pointer-events: none; transition: opacity .25s ease; }
      .scrim.show { opacity: 1; pointer-events: auto; }
      .topbar { height: 64px; flex-basis: 64px; padding-right: 14px; }
      .workspace { padding: 8px 18px 72px; }
      h1 { margin-bottom: 44px; font-size: 27px; }
      .welcome { max-width: 620px; }
    }
    @media (max-width: 560px) {
      body { overflow: hidden; }
      .rail { padding-top: 12px; }
      .rail-nav .icon-btn:nth-child(3) { display: none; }
      .start-btn { display: none; }
      .topbar { padding-right: 10px; }
      .workspace { padding: 0 12px 28px; align-items: center; }
      .welcome { transform: translateY(-10px); }
      h1 { font-size: 24px; margin-bottom: 34px; }
      .composer { min-height: 104px; border-radius: 21px; }
      .suggestion { min-height: 44px; font-size: 13px; }
      .suggestions { margin-top: 16px; }
      .chat-view { height: calc(100dvh - 64px); }
      .message { max-width: 90%; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <nav class="rail" aria-label="주 메뉴">
      <button class="brand" id="sidebarToggle" aria-label="사이드바 펼치기" aria-expanded="false"><span class="brand-mark">IA</span></button>
      <div class="rail-nav">
        <button class="icon-btn" aria-label="워크스페이스" title="워크스페이스"><svg viewBox="0 0 24 24" fill="none"><path d="M8 3h8l5 9-5 9H8l-5-9z" stroke-width="1.7"/></svg></button>
        <button class="icon-btn active" id="newChatRail" aria-label="새 채팅" title="새 채팅"><svg viewBox="0 0 24 24" fill="none"><path d="M20 11.5a8 8 0 0 1-8.4 8L5 21l1.6-4.4A8 8 0 1 1 20 11.5Z" stroke-width="1.7"/></svg></button>
        <button class="icon-btn" aria-label="사용 설명서" title="사용 설명서"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H11v17H7.5A3.5 3.5 0 0 0 4 22Zm16 0A3.5 3.5 0 0 0 16.5 2H13v17h3.5A3.5 3.5 0 0 1 20 22Z" stroke-width="1.7"/></svg></button>
      </div>
      <div class="rail-bottom">
        <button class="icon-btn" aria-label="로그인" title="로그인"><svg viewBox="0 0 24 24" fill="none"><path d="M14 8V5H4v14h10v-3M10 12h10m0 0-3-3m3 3-3 3" stroke-width="1.7"/></svg></button>
        <button class="icon-btn" aria-label="회원가입" title="회원가입"><svg viewBox="0 0 24 24" fill="none"><path d="M15 20a6 6 0 0 0-12 0m6-9a4 4 0 1 0 0-8m10 5v6m-3-3h6" stroke-width="1.7"/></svg></button>
      </div>
    </nav>

    <aside class="sidebar" id="sidebar" aria-hidden="true">
      <div class="sidebar-head"><span class="sidebar-title">Insight AI</span><button class="icon-btn" id="sidebarClose" aria-label="사이드바 닫기">×</button></div>
      <button class="new-chat" id="newChatSide"><span>＋</span><span>새 채팅</span></button>
      <div class="history-label">최근 대화</div>
      <button class="history-item">분기별 성과 핵심 요약</button>
      <button class="history-item">고객 피드백 주요 패턴</button>
      <div class="sidebar-foot">대화 내용은 이 기기에만 표시됩니다.</div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-btn top-chat" id="topNewChat" aria-label="새 채팅"><svg viewBox="0 0 24 24" fill="none"><path d="M20 11.5a8 8 0 0 1-8.4 8L5 21l1.6-4.4A8 8 0 1 1 20 11.5Z" stroke-width="1.7"/></svg></button>
        <button class="icon-btn dots" id="moreButton" aria-label="더 보기" aria-expanded="false">···</button>
        <button class="start-btn" id="startButton">시작하기</button>
      </header>

      <section class="workspace">
        <div class="welcome" id="welcome">
          <h1 id="welcomeTitle">업무에 대해 무엇이 궁금하신가요?</h1>
          <form class="composer" id="welcomeForm">
            <textarea id="welcomeInput" aria-label="질문 입력" placeholder="데이터와 업무에 관해 물어보세요" rows="1"></textarea>
            <div class="composer-actions">
              <button class="icon-btn plus" type="button" data-toast="파일 연결은 다음 단계에서 설정할 수 있어요." aria-label="추가 메뉴">＋</button>
              <button class="send" id="welcomeSend" type="submit" aria-label="질문 보내기" disabled><svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5m0 0-6 6m6-6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
          </form>
          <div class="suggestions" id="suggestions" aria-label="추천 질문"></div>
        </div>

        <div class="chat-view" id="chatView">
          <div class="messages" id="messages" aria-live="polite"></div>
          <form class="composer chat-composer" id="chatForm">
            <textarea id="chatInput" aria-label="후속 질문 입력" placeholder="후속 질문을 입력하세요" rows="1"></textarea>
            <div class="composer-actions">
              <button class="icon-btn plus" type="button" data-toast="파일 연결은 다음 단계에서 설정할 수 있어요." aria-label="추가 메뉴">＋</button>
              <button class="send" id="chatSend" type="submit" aria-label="질문 보내기" disabled><svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5m0 0-6 6m6-6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
          </form>
        </div>
      </section>

      <div class="popover" id="moreMenu" role="menu">
        <button role="menuitem" data-toast="대화 링크가 준비되었습니다.">대화 공유</button>
        <button role="menuitem" data-toast="화면 설정은 기본값으로 유지됩니다.">화면 설정</button>
        <button role="menuitem" data-toast="도움말을 준비 중입니다.">도움말</button>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    // 이 객체만 수정하면 첫 화면의 콘텐츠를 교체할 수 있습니다.
    const CONTENT = {
      title: '업무에 대해 무엇이 궁금하신가요?',
      placeholder: '데이터와 업무에 관해 물어보세요',
      suggestions: [
        '이번 주 핵심 성과를 한눈에 정리해 주세요.',
        '고객 피드백에서 반복되는 이슈는 무엇인가요?',
        '다음 회의에서 확인해야 할 질문을 추천해 주세요.',
        '보고서 초안을 간결한 문장으로 바꿔 주세요.'
      ],
      demoAnswer: '좋아요. 현재 화면은 실제 데이터 연결 전의 인터랙션 데모입니다. 이후 데이터 소스나 API를 연결하면 이 영역에 맞춤 응답을 표시할 수 있습니다.'
    };

    const $ = (selector) => document.querySelector(selector);
    const welcome = $('#welcome');
    const chatView = $('#chatView');
    const messages = $('#messages');
    const sidebar = $('#sidebar');
    const main = $('#main');
    const scrim = $('#scrim');
    const moreMenu = $('#moreMenu');
    let toastTimer;

    $('#welcomeTitle').textContent = CONTENT.title;
    $('#welcomeInput').placeholder = CONTENT.placeholder;
    $('#suggestions').innerHTML = CONTENT.suggestions.map(q => `<button class="suggestion" type="button"><span>${q}</span><span>↗</span></button>`).join('');

    function showToast(text) {
      const toast = $('#toast');
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2100);
    }

    function resizeInput(el) {
      el.style.height = 'auto';
      el.style.height = `${Math.min(el.scrollHeight, 135)}px`;
      const send = el.closest('form').querySelector('.send');
      send.disabled = !el.value.trim();
    }

    function setSidebar(open) {
      sidebar.classList.toggle('open', open);
      sidebar.setAttribute('aria-hidden', String(!open));
      $('#sidebarToggle').setAttribute('aria-expanded', String(open));
      if (window.innerWidth > 820) main.classList.toggle('shift', open);
      else scrim.classList.toggle('show', open);
    }

    function newChat() {
      messages.innerHTML = '';
      chatView.classList.remove('active');
      welcome.style.display = '';
      $('#welcomeInput').value = '';
      resizeInput($('#welcomeInput'));
      setSidebar(false);
      $('#welcomeInput').focus();
    }

    function addMessage(type, text) {
      const item = document.createElement('div');
      item.className = `message ${type}`;
      item.textContent = text;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    function ask(question) {
      const value = question.trim();
      if (!value) return;
      welcome.style.display = 'none';
      chatView.classList.add('active');
      addMessage('user', value);
      setTimeout(() => addMessage('ai', CONTENT.demoAnswer), 360);
      $('#chatInput').value = '';
      resizeInput($('#chatInput'));
    }

    ['welcomeInput', 'chatInput'].forEach(id => {
      const input = document.getElementById(id);
      input.addEventListener('input', () => resizeInput(input));
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          input.closest('form').requestSubmit();
        }
      });
    });
    $('#welcomeForm').addEventListener('submit', e => { e.preventDefault(); ask($('#welcomeInput').value); });
    $('#chatForm').addEventListener('submit', e => { e.preventDefault(); const q = $('#chatInput').value; if (q.trim()) { addMessage('user', q.trim()); $('#chatInput').value = ''; resizeInput($('#chatInput')); setTimeout(() => addMessage('ai', CONTENT.demoAnswer), 360); } });
    $('#suggestions').addEventListener('click', e => { const btn = e.target.closest('.suggestion'); if (btn) ask(btn.querySelector('span').textContent); });

    $('#sidebarToggle').addEventListener('click', () => setSidebar(!sidebar.classList.contains('open')));
    $('#sidebarClose').addEventListener('click', () => setSidebar(false));
    scrim.addEventListener('click', () => setSidebar(false));
    ['newChatRail', 'newChatSide', 'topNewChat'].forEach(id => document.getElementById(id).addEventListener('click', newChat));
    $('#moreButton').addEventListener('click', e => { e.stopPropagation(); const open = moreMenu.classList.toggle('open'); e.currentTarget.setAttribute('aria-expanded', String(open)); });
    document.addEventListener('click', e => { if (!moreMenu.contains(e.target)) { moreMenu.classList.remove('open'); $('#moreButton').setAttribute('aria-expanded', 'false'); } });
    document.querySelectorAll('[data-toast]').forEach(el => el.addEventListener('click', () => showToast(el.dataset.toast)));
    $('#startButton').addEventListener('click', () => { $('#welcomeInput').focus(); showToast('질문을 입력해 시작해 보세요.'); });
    window.addEventListener('resize', () => { if (window.innerWidth <= 820) main.classList.remove('shift'); else if (sidebar.classList.contains('open')) main.classList.add('shift'); });
  </script>
</body>
</html>
